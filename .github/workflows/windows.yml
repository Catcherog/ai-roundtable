name: Windows desktop
on:
  push:
    branches: [main, 'codex/windows-desktop']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build portable desktop
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Exercise the extracted release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $env:RUNNER_TEMP '测试 圆桌'
          Expand-Archive -LiteralPath dist/windows/AI-Roundtable-Windows-x64.zip -DestinationPath $extract
          $app = Join-Path $extract 'AI-Roundtable'
          & "$app/runtime/python.exe" -X utf8 scripts/verify_windows.py $app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify_windows_ui.cjs $app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/windows/AI-Roundtable-Windows-x64.zip
          compression-level: 0
          retention-days: 7
  attach:
    if: github.ref_type == 'tag' && github.event_name == 'push'
    needs: windows
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist/windows
      - name: Attach the tested Windows build to an existing release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view $env:GITHUB_REF_NAME --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -or $draft -ne 'true') { throw 'An existing draft release is required.' }
          Get-FileHash dist/windows/AI-Roundtable-Windows-x64.zip -Algorithm SHA256
          gh release upload $env:GITHUB_REF_NAME dist/windows/AI-Roundtable-Windows-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
